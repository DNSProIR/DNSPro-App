name: Build Android

on:
  push:
    paths:
      - "apps/android/**"
      - "shared/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "shared/**"
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret; skipping release signing setup."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > dnspro-release.keystore
          cat > keystore.properties <<EOF
          STORE_FILE=dnspro-release.keystore
          STORE_PASSWORD=${ANDROID_STORE_PASSWORD}
          KEY_ALIAS=${ANDROID_KEY_ALIAS}
          KEY_PASSWORD=${ANDROID_KEY_PASSWORD}
          EOF
      - name: Assemble APK
        run: |
          if [ -f keystore.properties ]; then
            echo "Building signed release APK..."
            gradle assembleRelease --no-daemon
          else
            echo "Building debug APK (no release keystore configured)..."
            gradle assembleDebug --no-daemon
          fi
      - name: Collect APK
        run: |
          mkdir -p ../../artifacts/android
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../../artifacts/android/DNSPro-Android.apk
          else
            find . -path '*/apk/debug/*.apk' -exec cp {} ../../artifacts/android/DNSPro-Android-debug.apk \;
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: android-build
          path: artifacts/android
          if-no-files-found: warn
