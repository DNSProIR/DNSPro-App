name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
  linux:
    uses: ./.github/workflows/build-linux.yml
  android:
    uses: ./.github/workflows/build-android.yml

  publish:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release
          ls -laR artifacts

          # Windows: single zip only
          find artifacts -type f -name 'DNSPro-Windows-x64.zip' -exec cp -f {} release/ \;

          # Linux binary
          find artifacts -type f -name 'dnspro' -exec cp -f {} release/DNSPro-Linux-x86_64 \;
          find artifacts -type f -name 'DNSPro-Linux-x86_64' -exec cp -f {} release/ \;
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp -f {} release/ \;

          # Android APK (prefer renamed copy)
          find artifacts -type f -name '*.apk' | head -n1 | while read -r apk; do
            cp -f "$apk" release/DNSPro-Android.apk
          done

          ls -la release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
